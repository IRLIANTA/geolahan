<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoLahan - Admin WebGIS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#141614;--side:#0e100e;--card:#1b1e1b;--line:#2a2f2a;--tx:#f4f6f3;--mut:#98a398;--g:#34c26b;--gd:#27a057;--w:#f6f7f5;--k:#121412}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}
#shell{display:grid;grid-template-columns:250px 1fr;min-height:100%}
#side{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px;font-weight:700;font-size:17px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--g);color:var(--k);display:grid;place-items:center;font-weight:800}
.grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:14px 10px 6px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:#cfd6cf}
.nav a i{font-style:normal;width:20px;text-align:center;color:var(--mut)}
.nav a:hover{background:#181b18}.nav a.on{background:var(--g);color:var(--k);font-weight:600}.nav a.on i{color:var(--k)}
.who{margin-top:24px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--mut)}
#main{padding:28px 32px;min-width:0}
#top{display:none}
.eyebrow{color:var(--g);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
h1{font-size:28px;margin:4px 0 6px;letter-spacing:-.01em}h2{font-size:18px;margin:0 0 10px}
p{color:var(--mut);margin:0 0 10px}
.g{color:var(--g)}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button:hover{border-color:var(--g)}
.pri{background:var(--g);border-color:var(--g);color:var(--k);font-weight:600}.pri:hover{background:var(--gd)}
.out{background:transparent;color:var(--tx)}
.dgr{color:#f0a0a0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.white{background:var(--w);color:var(--k);border-color:var(--w)}.white p{color:#4a524a}.white h2{color:var(--k)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch;margin-bottom:22px}
.hero h1{font-size:40px;line-height:1.12}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.stat:hover{transform:none;border-color:var(--line)}
.mod{display:block;transition:.15s}.mod:hover{border-color:var(--g);transform:translateY(-2px)}
.mod .ic{width:38px;height:38px;border-radius:10px;background:#242a24;display:grid;place-items:center;font-size:18px;color:var(--g);margin-bottom:10px}
.mod b{font-size:22px;display:block;color:var(--g)}
.num{font-size:34px;font-weight:700;color:var(--k)}
.step{display:flex;gap:12px;margin-bottom:12px}.step span{flex:none;width:28px;height:28px;border-radius:50%;background:var(--k);color:var(--g);display:grid;place-items:center;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:4px 12px;border-radius:99px;border:1px solid var(--line);font-size:12px}
.white .chip{border-color:#c8cec8}
.ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
.tool{display:flex;gap:10px;margin-bottom:14px;align-items:center}.tool input{flex:1;max-width:320px}.tool small{color:var(--mut)}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid #232823;vertical-align:top}td small{color:var(--mut)}
.act{display:flex;gap:4px}.act button{padding:3px 8px;font-size:12px}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;background:#34c26b22;color:var(--g)}.tag.d{background:#ffffff14;color:#cfd6cf}.tag.s{background:var(--w);color:var(--k)}
.mapbox{position:sticky;top:20px;height:calc(100vh - 220px);min-height:340px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#map{height:100%}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:min(480px,94vw)}
dialog::backdrop{background:#000b}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}dialog input,dialog select,dialog textarea{width:100%}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.empty{padding:30px;text-align:center;color:var(--mut)}
@media(max-width:900px){#shell{grid-template-columns:1fr}#side{position:fixed;z-index:2000;left:-260px;width:250px;transition:.2s}#side.open{left:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--side);border-bottom:1px solid var(--line)}
#main{padding:18px 16px}.hero,.split,.g3,.g2{grid-template-columns:1fr}.hero h1{font-size:30px}.mapbox{position:static;height:320px}}
</style>
</head>
<body>
<div id="top"><button onclick="document.getElementById('side').classList.toggle('open')">☰</button><b>GeoLahan</b></div>
<div id="shell">
<aside id="side"><div class="brand"><div class="logo">G</div>GeoLahan</div>
<nav class="nav" id="nav"></nav>
<div class="who">Masuk sebagai <b style="color:var(--tx)">Administrator</b><br>Akses penuh · Data lokal (demo)</div></aside>
<main id="main"></main>
</div>
<dialog id="dlg">
<h2 id="dT"></h2>
<label>Nama</label><input id="fN">
<label>Desa</label><input id="fD" placeholder="mis. Desa Sungai Durian">
<div id="fSubW" style="display:none"><label>Tipe multi-geometri</label><select id="fSub"><option>MultiPoint</option><option>MultiLineString</option><option>MultiPolygon</option></select></div>
<label>Status</label><select id="fS"><option>Draft</option><option>Diverifikasi</option><option>Selesai</option></select>
<label>Keterangan</label><input id="fK">
<label>Koordinat (lat,lng per baris)</label><textarea id="fC" rows="7"></textarea>
<div id="fH" style="font-size:12px;color:var(--mut);margin:6px 0 12px"></div>
<div style="display:flex;gap:8px;justify-content:flex-end"><button class="out" onclick="dlg.close()">Batal</button><button class="pri" onclick="saveF()">Simpan</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script>
const $=s=>document.querySelector(s),dlg=$('#dlg');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C={
 polygon:{t:'Polygon',i:'⬠',d:'Batas bidang lahan yang dibuka. Luas dan keliling dihitung otomatis.',min:3,h:'Minimal 3 titik. Polygon ditutup otomatis.'},
 point:{t:'Titik (Point)',i:'●',d:'Lokasi tunggal seperti patok, sampel tanah, atau titik foto lapangan.',min:1,h:'Satu titik: lat,lng.'},
 line:{t:'Garis (Polyline)',i:'╱',d:'Jalan akses, parit, atau jalur survei. Panjang dihitung otomatis.',min:2,h:'Minimal 2 titik berurutan.'},
 multi:{t:'Multi-Geometri',i:'⬡',d:'MultiPoint, MultiLineString, dan MultiPolygon: beberapa bagian dalam satu objek.',min:1,h:'Pisahkan tiap bagian dengan satu baris kosong.'},
 tin:{t:'TIN',i:'△',d:'Jaringan segitiga tak beraturan dari titik-titik tinggi, dasar model permukaan.',min:3,h:'Minimal 3 titik. Segitiga Delaunay dibuat otomatis.'}
};
const S={
 polygon:[{nama:'Blok A - Kebun Sawit',desa:'Desa Sungai Durian',status:'Diverifikasi',ket:'Pembukaan tahap 1',txt:'-0.0270,109.3400\n-0.0270,109.3425\n-0.0290,109.3425\n-0.0290,109.3400'},{nama:'Blok B - Lahan Cadangan',desa:'Desa Mekar Jaya',status:'Draft',ket:'Rencana',txt:'-0.0310,109.3440\n-0.0305,109.3470\n-0.0330,109.3475\n-0.0335,109.3445'}],
 point:[{nama:'Patok P-01',desa:'Desa Sungai Durian',status:'Selesai',ket:'Sudut barat laut Blok A',txt:'-0.0270,109.3400'},{nama:'Sampel Tanah S-02',desa:'Desa Mekar Jaya',status:'Draft',ket:'Kedalaman 30 cm',txt:'-0.0300,109.3450'}],
 line:[{nama:'Jalan Akses Utama',desa:'Desa Sungai Durian',status:'Diverifikasi',ket:'Lebar rencana 6 m',txt:'-0.0260,109.3380\n-0.0270,109.3400\n-0.0285,109.3412\n-0.0300,109.3445'}],
 multi:[{nama:'Petak Terpisah Timur',desa:'Desa Karya Bersama',sub:'MultiPolygon',status:'Draft',ket:'Dua petak satu pemilik',txt:'-0.0350,109.3500\n-0.0350,109.3520\n-0.0365,109.3520\n-0.0365,109.3500\n\n-0.0380,109.3505\n-0.0380,109.3525\n-0.0392,109.3525\n-0.0392,109.3505'}],
 tin:[{nama:'Kontur Blok A',desa:'Desa Sungai Durian',status:'Selesai',ket:'Titik tinggi survei drone',txt:'-0.0270,109.3400\n-0.0270,109.3425\n-0.0290,109.3425\n-0.0290,109.3400\n-0.0280,109.3412\n-0.0275,109.3418'}]
};
const load=k=>{try{return JSON.parse(localStorage.getItem('geo2_'+k))||S[k].map((x,i)=>({id:k+i,...x}))}catch(e){return S[k].map((x,i)=>({id:k+i,...x}))}};
const store=(k,v)=>localStorage.setItem('geo2_'+k,JSON.stringify(v));
const NAV=[['g','Umum'],['beranda','Beranda','⌂'],['about','About','ⓘ'],['g','Data Spasial'],...Object.keys(C).map(k=>[k,C[k].t,C[k].i])];

/* geometri */
const parse=t=>t.trim().split(/\n\s*\n/).map(g=>g.trim().split('\n').map(l=>l.split(',').map(s=>+s.trim())).filter(a=>a.length>=2&&!a.some(isNaN)).map(([a,b])=>[b,a])).filter(g=>g.length);
const ring=g=>[...g,g[0]];
function build(k,sub,txt){
  const G=parse(txt),n=G.flat().length;if(n<C[k].min)return null;
  if(k==='polygon')return G[0].length>=3?{type:'Polygon',coordinates:[ring(G[0])]}:null;
  if(k==='point')return{type:'Point',coordinates:G[0][0]};
  if(k==='line')return G[0].length>=2?{type:'LineString',coordinates:G[0]}:null;
  if(k==='tin'){const f=turf.tin(turf.featureCollection(G.flat().map(p=>turf.point(p))));return f.features.length?f:null}
  if(sub==='MultiPoint')return{type:'MultiPoint',coordinates:G.flat()};
  if(sub==='MultiLineString')return G.every(g=>g.length>=2)?{type:'MultiLineString',coordinates:G}:null;
  return G.every(g=>g.length>=3)?{type:'MultiPolygon',coordinates:G.map(g=>[ring(g)])}:null;
}
const fm=v=>v.toLocaleString('id-ID',{maximumFractionDigits:2});
function ukur(k,g){
  if(k==='tin'){const a=g.features.reduce((s,f)=>s+turf.area(f),0)/1e4;return`${g.features.length} segitiga · ${fm(a)} ha`}
  if(/Polygon/.test(g.type)){return fm(turf.area(turf.feature(g))/1e4)+' ha'}
  if(/Line/.test(g.type))return fm(turf.length(turf.feature(g))*1000)+' m';
  return(g.type==='Point'?1:g.coordinates.length)+' titik';
}
const sc=s=>s==='Selesai'?'tag s':s==='Draft'?'tag d':'tag';

/* router */
let M=null,cur='';
function route(){
  const k=(location.hash||'#beranda').slice(1);cur=C[k]?k:(k==='about'?'about':'beranda');
  $('#nav').innerHTML=NAV.map(n=>n[0]==='g'?`<div class="grp">${n[1]}</div>`:`<a href="#${n[0]}" class="${n[0]===cur?'on':''}"><i>${n[2]}</i>${n[1]}</a>`).join('');
  $('#side').classList.remove('open');if(M){M.remove();M=null}
  $('#main').innerHTML=cur==='beranda'?home():cur==='about'?about():crudPage(cur);
  if(C[cur])initMap();window.scrollTo(0,0);
}
addEventListener('hashchange',route);

function home(){
  const all=Object.keys(C).flatMap(k=>load(k).map(x=>({...x,k,g:build(k,x.sub,x.txt)})));
  const by=k=>all.filter(x=>x.k===k);
  const ha=x=>x.g&&/Polygon/.test(x.g.type)?turf.area(turf.feature(x.g))/1e4:0;
  const luas=all.reduce((s,x)=>s+ha(x),0);
  const pj=by('line').reduce((s,x)=>s+(x.g?turf.length(turf.feature(x.g))*1000:0),0);
  const desa=[...new Set(all.map(x=>(x.desa||'').trim()).filter(Boolean))];
  const done=all.filter(x=>x.status==='Selesai').length;
  const pd={};all.forEach(x=>{const d=(x.desa||'').trim()||'Belum diisi';(pd[d]=pd[d]||{n:0,ha:0}).n++;pd[d].ha+=ha(x)});
  const card=(ic,v,l,h)=>(h?`<a href="${h}" class="card mod">`:'<div class="card mod stat">')+`<div class="ic">${ic}</div><b>${v}</b>${l}`+(h?'</a>':'</div>');
  return`<div class="hero"><div class="card" style="padding:32px"><div class="eyebrow">Sistem Informasi Geografis</div>
  <h1>Pemetaan pembukaan lahan yang <span class="g">akurat</span> dan terdokumentasi.</h1>
  <p style="max-width:520px">Gambar batas lahan, ukur luas, rekam jalur lapangan, dan kelola seluruh data spasial dalam satu panel admin.</p>
  <div style="display:flex;gap:10px;margin-top:18px"><a class="pri" style="padding:9px 18px;border-radius:8px" href="#polygon">Mulai Mapping</a><a class="out" style="padding:9px 18px;border-radius:8px;border:1px solid var(--line)" href="#about">Pelajari</a></div></div>
  <div class="card white" style="display:flex;flex-direction:column;justify-content:space-between"><div><div class="eyebrow" style="color:var(--gd)">Ringkasan</div><div class="num">${all.length}</div><p>objek spasial tersimpan</p></div>
  <div><div class="num">${fm(luas)} <small style="font-size:14px">ha</small></div><p style="margin:0">total luas terpetakan</p></div></div></div>
  <h2>Statistik pemetaan</h2><div class="grid g3" style="margin-bottom:22px">
  ${card('⬠',by('polygon').length,'Jumlah polygon lahan','#polygon')}
  ${card('⌂',desa.length,'Desa yang dipetakan')}
  ${card('▦',fm(luas)+' ha','Total luas lahan')}
  ${card('●',by('point').length,'Titik lokasi (patok, sampel)','#point')}
  ${card('╱',fm(pj)+' m','Total panjang jalur & jalan','#line')}
  ${card('✓',done+' / '+all.length,'Laporan berstatus selesai')}</div>
  <div class="grid g2"><div class="card"><h2>Sebaran per desa</h2><table><tr><th>Desa</th><th>Objek</th><th>Luas</th></tr>${Object.entries(pd).sort((a,b)=>b[1].n-a[1].n).map(([d,v])=>`<tr><td>${esc(d)}</td><td>${v.n}</td><td>${fm(v.ha)} ha</td></tr>`).join('')}</table></div>
  <div class="card"><h2>Data terbaru</h2><table><tr><th>Nama</th><th>Modul</th><th>Status</th></tr>${all.slice(-6).reverse().map(x=>`<tr><td>${esc(x.nama)}<br><small>${esc(x.desa||'')}</small></td><td>${C[x.k].t}</td><td><span class="${sc(x.status)}">${esc(x.status)}</span></td></tr>`).join('')}</table></div></div>`;
}
function about(){
  return`<div class="eyebrow">About</div><h1>Untuk apa website ini?</h1><p style="max-width:640px">GeoLahan membantu admin mencatat dan melaporkan kegiatan pembukaan lahan berbasis peta, dari rencana hingga realisasi di lapangan.</p>
  <div class="grid g3" style="margin:18px 0">${[['Pelaporan','Setiap lahan tercatat lengkap dengan status, tanggal, dan keterangan sehingga mudah dipertanggungjawabkan.'],['Pengukuran','Luas, panjang, dan keliling dihitung otomatis dari geometri, tanpa hitung manual.'],['Dokumentasi','Data bisa diimport dari drone dan diexport ke GeoJSON atau CSV untuk QGIS dan ArcGIS.']].map(([a,b],i)=>`<div class="card"><div class="mod"><div class="ic">${['▤','⌖','⇄'][i]}</div></div><h2>${a}</h2><p style="margin:0">${b}</p></div>`).join('')}</div>
  <div class="grid g2"><div class="card white"><h2>Alur kerja</h2>${['Survei lapangan dengan tracking GPS atau drone.','Gambar atau import geometri ke modul yang sesuai.','Verifikasi dan ubah status laporan.','Export data untuk pelaporan dan analisis lanjutan.'].map((s,i)=>`<div class="step"><span>${i+1}</span><div>${s}</div></div>`).join('')}</div>
  <div class="card"><h2>Jenis geometri</h2>${Object.keys(C).map(k=>`<p><b style="color:var(--tx)">${C[k].i} ${C[k].t}</b><br>${C[k].d}</p>`).join('')}<h2 style="margin-top:14px">Teknologi</h2><div class="chips">${['Leaflet','Turf.js','Esri Satelit','NASA GIBS','Vercel'].map(c=>`<span class="chip">${c}</span>`).join('')}</div></div></div>
  <p style="margin-top:14px">Catatan: citra satelit resolusi tinggi diperbarui berkala, bukan realtime. Citra harian NASA tersedia dengan resolusi lebih kasar.</p>`;
}
function crudPage(k){
  return`<div class="ph"><div><div class="eyebrow">Data Spasial</div><h1>${C[k].i} ${C[k].t}</h1><p>${C[k].d}</p></div><button class="pri" onclick="openF()">+ Tambah</button></div>
  <div class="tool"><input id="q" placeholder="Cari nama / desa…" oninput="list()"><select id="fs" onchange="list()"><option value="">Semua status</option><option>Draft</option><option>Diverifikasi</option><option>Selesai</option></select><small id="cnt"></small></div>
  <div class="split"><div class="card" style="padding:8px"><div id="tb"></div></div><div class="mapbox"><div id="map"></div></div></div>`;
}
let grp;
function initMap(){
  M=L.map('map',{center:[-0.03,109.345],zoom:14});
  const e=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(M);
  const o=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'});
  L.control.layers({Satelit:e,Peta:o}).addTo(M);grp=L.featureGroup().addTo(M);list(true);
}
function list(fit){
  const k=cur,q=($('#q').value||'').toLowerCase(),f=$('#fs').value;
  const d=load(k).filter(x=>(x.nama+' '+(x.desa||'')).toLowerCase().includes(q)&&(!f||x.status===f));
  $('#cnt').textContent=d.length+' data';grp.clearLayers();
  d.forEach(x=>{const g=build(k,x.sub,x.txt);if(!g)return;x._g=g;
    const l=L.geoJSON(g,{style:{color:'#34c26b',weight:3,fillOpacity:.25},pointToLayer:(_,ll)=>L.circleMarker(ll,{radius:7,color:'#fff',fillColor:'#34c26b',fillOpacity:1})});
    l.bindPopup(`<b>${esc(x.nama)}</b><br>${ukur(k,g)}`);l.rid=x.id;grp.addLayer(l);
    if(k==='tin')L.geoJSON(x.txt?turf.featureCollection(parse(x.txt).flat().map(p=>turf.point(p))):[],{pointToLayer:(_,ll)=>L.circleMarker(ll,{radius:4,color:'#fff',fillColor:'#fff',fillOpacity:1})}).addTo(grp)});
  $('#tb').innerHTML=d.length?`<table><tr><th>Nama</th><th>Ukuran</th><th></th></tr>${d.map(x=>`<tr><td><b>${esc(x.nama)}</b><br><small>${esc(x.desa?x.desa+' · ':'')}${esc(x.sub?x.sub+' · ':'')}${esc(x.ket)}</small><br><span class="${sc(x.status)}">${esc(x.status)}</span></td><td>${x._g?ukur(k,x._g):'-'}</td><td><div class="act"><button onclick="zoom('${x.id}')">Lihat</button><button onclick="openF('${x.id}')">Edit</button><button class="dgr" onclick="del('${x.id}')">Hapus</button></div></td></tr>`).join('')}</table>`:'<div class="empty">Belum ada data. Klik “+ Tambah”.</div>';
  if(fit&&grp.getLayers().length)M.fitBounds(grp.getBounds(),{padding:[30,30],maxZoom:17});
}
function zoom(id){const l=grp.getLayers().find(x=>x.rid===id);if(l){M.fitBounds(l.getBounds(),{maxZoom:18,padding:[40,40]});l.openPopup&&l.openPopup()}}
let eid=null;
function openF(id){
  const k=cur,x=id?load(k).find(y=>y.id===id):null;eid=id||null;
  $('#dT').textContent=(x?'Edit ':'Tambah ')+C[k].t;
  $('#fN').value=x?.nama||'';$('#fD').value=x?.desa||'';$('#fS').value=x?.status||'Draft';$('#fK').value=x?.ket||'';$('#fC').value=x?.txt||'';
  $('#fSubW').style.display=k==='multi'?'block':'none';$('#fSub').value=x?.sub||'MultiPoint';
  $('#fH').textContent=C[k].h+' Menggambar langsung di peta akan ditambahkan saat integrasi.';dlg.showModal();
}
function saveF(){
  const k=cur,nama=$('#fN').value.trim(),txt=$('#fC').value.trim(),sub=k==='multi'?$('#fSub').value:undefined;
  if(!nama)return alert('Nama wajib diisi');
  if(!build(k,sub,txt))return alert('Koordinat belum valid. '+C[k].h);
  const d=load(k),r={nama,desa:$('#fD').value.trim(),status:$('#fS').value,ket:$('#fK').value,txt,...(sub&&{sub})};
  if(eid)Object.assign(d.find(y=>y.id===eid),r);else d.push({id:k+Date.now(),...r});
  store(k,d);dlg.close();list(true);
}
function del(id){if(confirm('Hapus data ini?')){store(cur,load(cur).filter(x=>x.id!==id));list()}}
route();
</script>
